num_nodes: 5
min_neighbors: 2
max_neighbors: 3

resources:
  n1: [r1]
  n2: [r2]
  n3: [r3]
  n4: [r4]
  n5: [r5]

edges:
  - [n1, n2]
  - [n2, n3]
  - [n3, n4]
  - [n4, n5]
  - [n5, n1]
  # Wait, this is a ring, so degree of all nodes is 2. Let's add more edges to n1.
  - [n1, n3]
  - [n1, n4] # n1 degree will be 4, which exceeds max_neighbors: 3.
